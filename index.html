<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Projetos - testeence</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f4f6f9;
}

header{
    background:#0d1117;
    color:white;
    padding:30px;
    text-align:center;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
    margin-top:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.card h3{
    margin-top:0;
}

.button{
    display:inline-block;
    padding:10px 15px;
    background:#0969da;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

footer{
    margin-top:40px;
    padding:20px;
    background:#0d1117;
    color:white;
    text-align:center;
}
</style>
</head>

<body>

<header>
    <h1>Portal de Projetos GitHub</h1>
    <p>Repositórios públicos do usuário testeence</p>
</header>

<div class="container">

    <h2>Projetos</h2>

    <div id="repos" class="grid"></div>

</div>

<footer>
    Desenvolvido com GitHub Pages
</footer>

<script>

fetch('https://api.github.com/users/testeence/repos?sort=updated')
.then(response => response.json())
.then(data => {

    const container = document.getElementById('repos');

    data.forEach(repo => {

        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
            <h3>${repo.name}</h3>

            <p>
            ${repo.description || 'Sem descrição disponível'}
            </p>

            <p>
            <strong>Linguagem:</strong>
            ${repo.language || 'Não informada'}
            </p>

            <a classtml_url}
               Ver Repositório
            </a>
        `;

        container.appendChild(card);
    });

});
</script>

</body>
</html>
