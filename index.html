<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Portal de Projetos - testeence</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width: 1200px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

header{
    text-align:center;
    margin-bottom:30px;
}

#perfil img{
    width:120px;
    border-radius:50%;
}

#controles{
    display:flex;
    gap:10px;
    margin:20px 0;
    flex-wrap:wrap;
}

input,select{
    padding:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.15);
}

.card:hover{
    transform:translateY(-3px);
}

.card h3{
    margin-top:0;
}

.avatar{
    width:32px;
    height:32px;
    border-radius:50%;
    margin-right:4px;
}

.badge{
    display:inline-block;
    padding:4px 8px;
    background:#0969da;
    color:white;
    border-radius:5px;
    font-size:12px;
}

a{
    color:#0969da;
    text-decoration:none;
}

</style>

</head>
<body>

<header>
    <div id="perfil"></div>
</header>

<div id="controles">

    <input
      type="text"
      id="busca"
      placeholder="Pesquisar projeto">

    <select id="filtro">
        <option value="Todos">Todos</option>
        <option value="Workshop">Workshop</option>
        <option value="Site">Site</option>
        <option value="Outros">Outros</option>
    </select>

</div>

<div id="repositorios" class="grid"></div>

<script>

const usuario = "testeence";

let todosRepos = [];

function categoria(repo){

    const nome = repo.name.toLowerCase();

    if(nome.includes("workshop"))
        return "Workshop";

    if(
       nome.includes("page") ||
       nome.includes("github.io") ||
       nome.includes("site"))
       return "Site";

    return "Outros";
}

async function carregarPerfil(){

    const resposta =
      await fetch(`https://api.github.com/users/${usuario}`);

    const user =
      await resposta.json();

    document.getElementById("perfil").innerHTML = `
        <img srcvatar_url}
        <h1>${user.name || user.login}</h1>
        <p>${user.bio || ""}</p>
        <p>
            Repositórios públicos:
            ${user.public_repos}
        </p>
    `;
}

async function carregarRepos(){

    const resposta =
      await fetch(
      `https://api.github.com/users/${usuario}/repos?sort=updated`);

    todosRepos =
      await resposta.json();

    renderizar(todosRepos);
}

async function colaboradores(url){

    try{

        const r = await fetch(url);
        const dados = await r.json();

        return dados.slice(0,5)
            .map(c =>
               `<img class="avatar"
                     src="${c.avatar_url}"
                     title="${c.loginderizar(lista){

    const container =
      document.getElementById("repositorios");

    container.innerHTML = "";

    for(const repo of lista){

        const cat = categoria(repo);

        const colabs =
           await colaboradores(
           repo.contributors_url);

        container.innerHTML += `

        <div class="card repo-card"
             data-cat="${cat}">

            <h3>${repo.name}</h3>

            <span class="badge">
                ${cat}
            </span>

            <p>
                ${repo.description || 'Sem descrição'}
            </p>

            <p>
                <strong>Linguagem:</strong>
                ${repo.language || 'N/A'}
            </p>

            <p>
                <strong>Colaboradores:</strong>
                <br>
                ${colabs}
            </p>

            <p>
                ${repo.html_url}
                   Abrir Repositório
                </a>
            </p>

        </div>`;
    }

    aplicarFiltro();
}

function aplicarFiltro(){

    const termo =
       document.getElementById("busca")
       .value
       .toLowerCase();

    const categoriaFiltro =
       document.getElementById("filtro")
       .value;

    document
       .querySelectorAll(".repo-card")
       .forEach(card=>{

          const texto =
             card.textContent.toLowerCase();

          const categoria =
             card.dataset.cat;

          const matchTexto =
             texto.includes(termo);

          const matchCategoria =
             categoriaFiltro === "Todos"
             ||
             categoria === categoriaFiltro;

          card.style.display =
             (matchTexto && matchCategoria)
             ? "block"
             : "none";
       });
}

document
.getElementById("busca")
.addEventListener("keyup", aplicarFiltro);

document
.getElementById("filtro")
.addEventListener("change", aplicarFiltro);

carregarPerfil();
carregarRepos();

</script>

</body>
</html>
