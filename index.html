<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ENCETESTE</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f5f5f5;
}

header{
    background:#0d1117;
    color:white;
    text-align:center;
    padding:40px 20px;
}

header img{
    width:140px;
    border-radius:50%;
    border:4px solid white;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.controls{
    margin:20px 0;
}

input{
    width:300px;
    max-width:100%;
    padding:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.card h3{
    margin-top:0;
}

.btn{
    display:inline-block;
    padding:8px 12px;
    background:#0969da;
    color:white;
    text-decoration:none;
    border-radius:6px;
}

.avatar{
    width:30px;
    height:30px;
    border-radius:50%;
    margin-right:4px;
}

.footer{
    text-align:center;
    padding:20px;
    color:#666;
}

</style>
</head>

<body>

<header>

<img src="httpsTESTE.png" alt="ENCETESTE">

<h1>ENCETESTE</h1>

<p>
Portal de Projetos, Workshops e Desenvolvimento
</p>

<p>
<a class="btn"
href="https://github.com/ENCETESTE"
target="_blank">
GitHub
</a>
</p>

</header>

<div class="container">

<div class="controls">

<input
type="text"
id="busca"
placeholder="Pesquisar projeto...">

</div>

<div id="repositorios" class="grid">

<p>Carregando repositórios...</p>

</div>

</div>

<div class="footer">

ENCETESTE • GitHub Pages

</div>

<script>

const usuario = "ENCETESTE";
let repos = [];

async function carregarRepos(){

    try{

        const resposta =
        await fetch(
        "https://api.github.com/users/" +
        usuario +
        "/repos?sort=updated"
        );

        repos = await resposta.json();

        mostrarRepos();

    }catch(erro){

        document.getElementById("repositorios").innerHTML =
        "<p>Erro ao carregar repositórios.</p>";

        console.log(erro);
    }

}

function filtrar(){

    mostrarRepos();

}

function mostrarRepos(){

    const busca =
    document
    .getElementById("busca")
    .value
    .toLowerCase();

    const container =
    document.getElementById("repositorios");

    container.innerHTML = "";

    repos.forEach(function(repo){

        if(
            !repo.name.toLowerCase()
            .includes(busca)
        ){
            return;
        }

        const descricao =
        repo.description ||
        "Sem descrição disponível";

        const linguagem =
        repo.language ||
        "Não informada";

        const card =
        document.createElement("div");

        card.className = "card";

        card.innerHTML =
        "<h3>" + repo.name + "</h3>" +
        "<p>" + descricao + "</p>" +
        "<p><strong>Linguagem:</strong> " +
        linguagem +
        "</p>" +
        "<a class='btn' href='" +
        repo.html_url +
        "' target='_blank'>Abrir Repositório</a>";

        container.appendChild(card);

    });

}

document
.getElementById("busca")
.addEventListener(
"keyup",
filtrar
);

carregarRepos();

</script>

</body>
</html>
