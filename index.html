<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Projetos - testeence</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

header{
    text-align:center;
    margin-bottom:30px;
}

#perfil img{
    width:120px;
    border-radius:50%;
}

#controles{
    margin:20px 0;
}

input, select{
    padding:8px;
    margin-right:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,0.2);
}

.avatar{
    width:30px;
    height:30px;
    border-radius:50%;
    margin-right:3px;
}
</style>
</head>

<body>

<header>

<div id="perfil">
    <p>Carregando perfil...</p>
</div>

</header>

<div id="controles">

<input
type="text"
id="busca"
placeholder="Pesquisar projeto">

<select id="filtro">
    <option value="Todos">Todos</option>
    <option value="Workshop">Workshop</option>
    <option value="Site">Site</option>
    <option value="Outros">Outros</option>
</select>

</div>

<div id="repositorios" class="grid"></div>

<script>

const usuario = "testeence";
let todosRepos = [];

function categoria(nome){

    nome = nome.toLowerCase();

    if(nome.includes("workshop")){
        return "Workshop";
    }

    if(
        nome.includes("github.io") ||
        nome.includes("page") ||
        nome.includes("site")
    ){
        return "Site";
    }

    return "Outros";
}

async function carregarPerfil(){

    document.getElementById("perfil").innerHTML =
    '<img src="https://github.com/' + usuario + '. '
    '<p>Projetos públicos no GitHub</p>';
}

async function carregarRepos(){

    try{

        const resposta = await fetch(
            'https://api.github.com/users/' +
            usuario +
            '/repos?sort=updated'
        );

        todosRepos = await resposta.json();

        renderizarRepos();

    }catch(erro){

        document.getElementById("repositorios").innerHTML =
        "<p>Erro ao carregar repositórios.</p>";

        console.log(erro);
    }
}

async function obterColaboradores(url){

    try{

        const resposta = await fetch(url);

        const colaboradores =
        await resposta.json();

        let html = "";

        colaboradores.slice(0,5).forEach(function(c){

            html +=
            '<img class="avatar" src="' +
            c.avatar_url +
            '" title="' +
            c.login +
            '">';
        });

        return html;

    }catch{

        return "";
    }
}

async function renderizarRepos(){

    const container =
    document.getElementById("repositorios");

    container.innerHTML = "";

    const textoBusca =
    document.getElementById("busca")
    .value
    .toLowerCase();

    const filtro =
    document.getElementById("filtro").value;

    for(const repo of todosRepos){

        const cat = categoria(repo.name);

        if(
            filtro !== "Todos" &&
            filtro !== cat
        ){
            continue;
        }

        if(
            !repo.name.toLowerCase()
            .includes(textoBusca)
        ){
            continue;
        }

        const colaboradores =
        await obterColaboradores(
            repo.contributors_url
        );

        const card =
        document.createElement("div");

        card.className = "card";

        card.innerHTML =
        "<h3>" + repo.name + "</h3>" +
        "<p><strong>Categoria:</strong> " + cat + "</p>" +
        "<p>" +
        (repo.description || "Sem descrição") +
        "</p>" +
        "<p><strong>Linguagem:</strong> " +
        (repo.language || "Não informada") +
        "</p>" +
        "<p><strong>Colaboradores:</strong><br>" +
        colaboradores +
        "</p>" +
        '<a href="' +
        repo.html_url +
        '" target="_blank">Abrir repositório</a>';

        container.appendChild(card);
    }
}

document
.getElementById("busca")
.addEventListener("keyup", renderizarRepos);

document
.getElementById("filtro")
.addEventListener("change", renderizarRepos);

carregarPerfil();
carregarRepos();

</script>

</body>
</html>
