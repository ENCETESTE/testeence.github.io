<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Meus Projetos</title>
</head>
<body>
    <h1>Meus Repositórios GitHub</h1>
    <ul id="repos"></ul>

    <script>
        fetch('https://api.github.com/users/SEU_USUARIO/repos')
            .then(response => response.json())
            .then(repos => {
                const lista = document.getElementById('repos');

                repos.forEach(repo => {
                    const item = document.createElement('li');
                    item.innerHTML =
                        `${repo.html_url}
                           ${repo.name}
                         </a>`;
                    lista.appendChild(item);
                });
            });
    </script>
</body>
</html>
